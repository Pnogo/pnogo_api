[project]
name = "pnogo-api"
dynamic = ["version"]
description = "Pnogo API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "granian==2.7.9",
    "itsdangerous==2.2.0",
    "markupsafe==3.0.3",
    "minio==7.2.20",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.4",
    "werkzeug==3.1.8",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I"]
