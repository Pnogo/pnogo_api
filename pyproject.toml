[project]
name = "pnogo-api"
version = "2.0.0"
description = "Pnogo API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "django-cors-headers>=4.6,<5",
    "django-storages[boto3]>=1.14,<2",
    "granian>=2.7,<3",
    "minio>=7.2,<8",
    "pillow>=10.2,<11",
    "psycopg[binary]>=3.1,<4",
    "markupsafe>=2.1,<3",
    "whitenoise>=6.8,<7",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I"]
